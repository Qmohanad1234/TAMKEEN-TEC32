<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Page Not Found - Tamkeen Engineering Services</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to the Tamkeen Engineering Services homepage."/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0075C9"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600&display=swap" rel="stylesheet"/>
<link href="assets/images/favicon.png" rel="icon" type="image/png" sizes="256x256"/>
<link href="assets/images/favicon.ico" rel="icon" type="image/x-icon"/>

<style>

:root {
    --tamkeen-primary-hex: #0075C9;
    --tamkeen-accent-hex: #009999;
    --tamkeen-text-hex: #222222;
    --tamkeen-bg-light-hex: #f0f4f8;
    --tamkeen-white-hex: #ffffff;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Open Sans', sans-serif;
    background-color: var(--tamkeen-bg-light-hex);
    color: var(--tamkeen-text-hex);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
}

.error-wrapper {
    max-width: 520px;
}

.error-wrapper img {
    height: 70px;
    margin-bottom: 30px;
}

.error-code {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 5rem;
    line-height: 1;
    background: linear-gradient(to right, var(--tamkeen-primary-hex), var(--tamkeen-accent-hex));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0 0 10px;
}

.error-wrapper h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.5rem;
    margin: 0 0 15px;
    color: var(--tamkeen-text-hex);
}

.error-wrapper p {
    font-size: 1rem;
    color: #555;
    margin: 0 0 30px;
    line-height: 1.6;
}

.error-home-link {
    display: inline-block;
    background-color: var(--tamkeen-primary-hex);
    color: white;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 8px;
    transition: background-color 0.25s ease;
}

.error-home-link:hover {
    background-color: var(--tamkeen-accent-hex);
}

a:focus-visible {
    outline: 3px solid var(--tamkeen-accent-hex);
    outline-offset: 2px;
}

</style>
</head>
<body>

<div class="error-wrapper">

<img alt="Tamkeen Logo" src="assets/images/logo-tamkeen-true-dimensions.png"/>

<p class="error-code">404</p>

<h1>We couldn't find that page</h1>

<p>The page you're looking for may have been moved, renamed, or no longer exists. Let's get you back on track.</p>

<a class="error-home-link" href="index.html">Back to Homepage</a>

</div>

</body>
</html>
